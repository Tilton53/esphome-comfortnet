---
substitutions:
  name: "comfortnet"
  friendly_name: "ComfortNet Device"
  device_description: "ComfortNet Device"
  tx_pin: GPIO19
  rx_pin: GPIO22
  platform: esp32
  board: esp32dev
  variant: esp32
  framework: esp-idf
  logger_level: WARN
  comfortnet_update_interval: 30s
  device_type: "0x1D" # Gateway device ID
  ct_version: 2 # Version of ClimateTalk (either 1 or 2)
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  min_version: "2026.11.0"
  project:
    name: "esphome-comfortnet.esphome-comfortnet"
    version: v1.0.0
  includes:
    - <vector>
  on_boot:
    then:
      - lambda: App.set_loop_interval(0);
${platform}:
  board: ${board}
  variant: ${variant}
  framework:
    type: ${framework}
preferences:
  flash_write_interval: "24h"
wifi:
  ap:
captive_portal:
web_server:
  port: 80
  version: 3
api:
  services:
    - service: thermostat_set_heat_setpoint
      variables:
        temperature_f: int
      then:
        - lambda: id(comfortnet_id).thermostat_set_heat_setpoint(temperature_f);
    - service: thermostat_set_cool_setpoint
      variables:
        temperature_f: int
      then:
        - lambda: id(comfortnet_id).thermostat_set_cool_setpoint(temperature_f);
    - service: thermostat_set_system_mode
      variables:
        mode: int
      then:
        - lambda: id(comfortnet_id).thermostat_set_system_mode(mode);
    - service: thermostat_set_fan_key
      variables:
        state: int
        demand: int
      then:
        - lambda: id(comfortnet_id).thermostat_set_fan_key(state, demand);
    - service: thermostat_set_hold_override
      variables:
        enabled: bool
      then:
        - lambda: id(comfortnet_id).thermostat_set_hold_override(enabled);
    - service: furnace_set_heat_demand
      variables:
        demand_percent: int
        duration_minutes: int
      then:
        - lambda: |-
            id(comfortnet_id).furnace_set_demand(comfortnet::CommandType::HEAT_DEMAND, demand_percent,
                                                 duration_minutes);
    - service: furnace_set_cool_demand
      variables:
        demand_percent: int
        duration_minutes: int
      then:
        - lambda: |-
            id(comfortnet_id).furnace_set_demand(comfortnet::CommandType::COOL_DEMAND, demand_percent,
                                                 duration_minutes);
    - service: furnace_set_backup_heat_demand
      variables:
        demand_percent: int
        duration_minutes: int
      then:
        - lambda: |-
            id(comfortnet_id).furnace_set_demand(comfortnet::CommandType::BACK_UP_HEAT_DEMAND,
                                                 demand_percent, duration_minutes);
    - service: furnace_set_defrost_heat_demand
      variables:
        demand_percent: int
        duration_minutes: int
      then:
        - lambda: |-
            id(comfortnet_id).furnace_set_demand(comfortnet::CommandType::DEFROST_HEAT_DEMAND,
                                                 demand_percent, duration_minutes);
    - service: furnace_set_aux_heat_demand
      variables:
        demand_percent: int
        duration_minutes: int
      then:
        - lambda: |-
            id(comfortnet_id).furnace_set_demand(comfortnet::CommandType::AUX_HEAT_DEMAND, demand_percent,
                                                 duration_minutes);
    - service: furnace_set_fan_demand
      variables:
        mode: int
        demand_percent: int
        duration_minutes: int
      then:
        - lambda: |-
            id(comfortnet_id).furnace_set_fan_demand(mode, demand_percent, duration_minutes);
    - service: comfortnet_get_user_menu
      variables:
        menu_file: int
        main_menu: int
        sub_menu: int
        fetch_offset: int
        max_return_bytes: int
      then:
        - lambda: |-
            if (menu_file < 0 || menu_file > 255 || main_menu < 0 || main_menu > 255 ||
                sub_menu < 0 || sub_menu > 255 || fetch_offset < 0 || fetch_offset > 65535 ||
                max_return_bytes < 1 || max_return_bytes > 234) {
              ESP_LOGW("comfortnet", "Rejected invalid GET_USER_MENU request fields");
              return;
            }
            id(comfortnet_id).get_user_menu(static_cast<uint8_t>(menu_file), static_cast<uint8_t>(main_menu),
                                            static_cast<uint8_t>(sub_menu), static_cast<uint16_t>(fetch_offset),
                                            static_cast<uint8_t>(max_return_bytes));
ota:
  platform: esphome
logger:
  level: ${logger_level}
  tx_buffer_size: 1024
  #baud_rate: 0 # Disable logging over uart
uart:
  id: comfortnet_uart
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: NONE
  rx_buffer_size: 1500
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
comfortnet:
  id: comfortnet_id
  uart_id: comfortnet_uart
  update_interval: ${comfortnet_update_interval}
  device_type: ${device_type}
  ct_version: ${ct_version}
globals:
  - id: user_menu_file_value
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: user_menu_main_value
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: user_menu_sub_value
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: user_menu_offset_value
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: user_menu_max_return_value
    type: uint8_t
    restore_value: false
    initial_value: "32"
number:
  - platform: template
    name: "User Menu File"
    id: user_menu_file
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    update_interval: 1s
    lambda: return id(user_menu_file_value);
    set_action:
      - lambda: id(user_menu_file_value) = static_cast<uint8_t>(x);
    entity_category: config
  - platform: template
    name: "User Menu Main"
    id: user_menu_main
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    update_interval: 1s
    lambda: return id(user_menu_main_value);
    set_action:
      - lambda: id(user_menu_main_value) = static_cast<uint8_t>(x);
    entity_category: config
  - platform: template
    name: "User Menu Sub"
    id: user_menu_sub
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    update_interval: 1s
    lambda: return id(user_menu_sub_value);
    set_action:
      - lambda: id(user_menu_sub_value) = static_cast<uint8_t>(x);
    entity_category: config
  - platform: template
    name: "User Menu Fetch Offset"
    id: user_menu_offset
    min_value: 0
    max_value: 65535
    step: 1
    mode: box
    update_interval: 1s
    lambda: return id(user_menu_offset_value);
    set_action:
      - lambda: id(user_menu_offset_value) = static_cast<uint32_t>(x);
    entity_category: config
  - platform: template
    name: "User Menu Max Return Bytes"
    id: user_menu_max_return
    min_value: 1
    max_value: 234
    step: 1
    mode: box
    update_interval: 1s
    lambda: return id(user_menu_max_return_value);
    set_action:
      - lambda: id(user_menu_max_return_value) = static_cast<uint8_t>(x);
    entity_category: config
sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    id: wifi_signal_sensor
    entity_category: "diagnostic"
  - platform: comfortnet
    name: "ComfortNet Queued Messages"
    id: comfortnet_queued_messages
    data_key: "PENDING_MESSAGE_COUNT"
    unit_of_measurement: "messages"
    accuracy_decimals: 0
    icon: "mdi:counter"
    entity_category: "diagnostic"
binary_sensor:
  - platform: comfortnet
    name: "ComfortNet Network Status"
    id: comfortnet_network_status
    device_class: connectivity
    data_key: "NETWORK_STATUS"
text_sensor:
  - platform: template
    name: "ComfortNet User Menu Response"
    id: user_menu_response
    update_interval: 1s
    entity_category: diagnostic
    lambda: |-
      const auto &response = id(comfortnet_id).last_user_menu_response();
      if (response.empty()) {
        return {};
      }
      return response;
button:
  - platform: template
    name: "Reconnect to ComfortNet"
    id: comfortnet_reconnect
    icon: "mdi:lan-connect"
    entity_category: "config"
    on_press:
      - lambda: id(comfortnet_id).reconnect();
  - platform: template
    name: "Read ComfortNet Root User Menu"
    id: comfortnet_read_user_menu_root
    icon: "mdi:menu"
    entity_category: "diagnostic"
    on_press:
      - lambda: |-
          id(user_menu_file_value) = 0;
          id(user_menu_main_value) = 0;
          id(user_menu_sub_value) = 0;
          id(user_menu_offset_value) = 0;
          id(user_menu_file).publish_state(0);
          id(user_menu_main).publish_state(0);
          id(user_menu_sub).publish_state(0);
          id(user_menu_offset).publish_state(0);
          id(comfortnet_id).get_user_menu(0, 0, 0, 0, id(user_menu_max_return_value));
  - platform: template
    name: "Read Selected ComfortNet User Menu Page"
    id: comfortnet_read_selected_user_menu
    icon: "mdi:menu-open"
    entity_category: "diagnostic"
    on_press:
      - lambda: |-
          id(comfortnet_id).get_user_menu(
              id(user_menu_file_value), id(user_menu_main_value), id(user_menu_sub_value),
              static_cast<uint16_t>(id(user_menu_offset_value)), id(user_menu_max_return_value));
  - platform: template
    name: "Advance ComfortNet User Menu Page"
    id: comfortnet_advance_user_menu
    icon: "mdi:page-next"
    entity_category: "diagnostic"
    on_press:
      - lambda: |-
          const uint32_t next_offset = id(comfortnet_id).next_user_menu_offset();
          if (next_offset > 65535) {
            ESP_LOGW("comfortnet", "Next user menu offset exceeds 16-bit range");
            return;
          }
          id(user_menu_offset_value) = next_offset;
          id(user_menu_offset).publish_state(next_offset);
          id(comfortnet_id).get_next_user_menu_page(id(user_menu_max_return_value));
  - platform: restart
    name: "Restart ESP"
    id: restart_esp
    icon: "mdi:restart"
    entity_category: "config"
